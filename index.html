<!DOCTYPE html> <html lang="en"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fr0di-Connect Landing Page</title>

<!-- CSS FILE -->
<link rel="stylesheet" href="index.css">
</head> <body>
<header>
    <img
        src="Logo for Fr0di Connect.png"
        class="logo"
        width="120"
        alt="Fr0di-Connect Logo"
    >
</header>

<main>
    <form class="nav">

        <h1>Welcome To Fr0di-Connect</h1>

        <label for="username">Username</label>
        <br>

        <input
            type="text"
            id="username"
            name="username"
            placeholder="Enter username"
        >

        <br><br>

        <label for="password">Password</label>
        <br>

        <input
            type="password"
            id="password"
            name="password"
            placeholder="Enter password"
        >

        <br><br>

        <button type="submit" class="button">
            Log In
        </button>

        <a href="index.html" class="guest-button">
            Guest
        </a>

    </form>
</main>
